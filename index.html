<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 수출 10일 잠정치</title>
<style>
  :root{
    --bg:#0B0E14; --surface:#12161F; --surface-2:#181E2A;
    --border:#232B3A; --border-soft:#1B2230;
    --text:#E7ECF3; --text-muted:#8A95AB; --text-dim:#5B6478;
    --blue:#5B9FEF; --blue-dim:#182A44;
    --amber:#F2B84B; --amber-dim:#3A2E14;
    --pos:#34D399; --pos-dim:#123227;
    --neg:#F87171; --neg-dim:#3A1A1A;
    --neutral:#64748B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    font-size:14px;line-height:1.5;padding:22px 20px 60px;max-width:1220px;margin:0 auto;}
  .mono{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;}
  h1{font-size:22px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
  .metaline{color:var(--text-dim);font-size:12px;margin-bottom:18px;}
  .metaline b{color:var(--text-muted);font-weight:600;}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:22px;}
  .kpi{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:13px 14px;}
  .kpi .label{font-size:11px;color:var(--text-dim);margin-bottom:8px;line-height:1.4;}
  .kpi .value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--text);}
  .kpi .yoy{font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:5px;}
  .kpi .yoy.pos{color:var(--pos);} .kpi .yoy.neg{color:var(--neg);}

  .insight-box{border:1px solid var(--border);background:var(--surface);border-radius:12px;
    padding:18px 20px;margin-bottom:22px;}
  .insight-box h3{margin:0 0 12px;font-size:14px;}
  .insight-item{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--text-muted);}
  .insight-item:first-of-type{border-top:none;}
  .insight-item .tag{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--amber);
    background:var(--amber-dim);border-radius:5px;padding:2px 7px;height:fit-content;white-space:nowrap;}
  .insight-item b{color:var(--text);}

  .board-head h2{font-size:15px;margin:0 0 4px;}
  .board-legend{font-size:11px;color:var(--text-dim);margin-bottom:14px;}
  .board-legend span{margin-right:14px;display:inline-flex;align-items:center;gap:4px;}
  .board-legend .d{width:6px;height:6px;border-radius:50%;display:inline-block;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:right;color:var(--text-dim);font-weight:600;font-size:10.5px;
    text-transform:uppercase;padding:0 8px 8px;border-bottom:1px solid var(--border);}
  thead th:first-child{text-align:left;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:var(--surface);}
  tbody td{padding:10px 8px;text-align:right;vertical-align:middle;}
  tbody td:first-child{text-align:left;}
  .item-name{font-weight:700;color:var(--text);}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px;white-space:nowrap;}
  .badge .d{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .badge.accel{background:var(--pos-dim);color:var(--pos);} .badge.accel .d{background:var(--pos);}
  .badge.decel{background:var(--amber-dim);color:var(--amber);} .badge.decel .d{background:var(--amber);}
  .badge.improve{background:var(--blue-dim);color:var(--blue);} .badge.improve .d{background:var(--blue);}
  .badge.worsen{background:var(--neg-dim);color:var(--neg);} .badge.worsen .d{background:var(--neg);}
  .pct.pos{color:var(--pos);font-family:'JetBrains Mono',monospace;font-weight:600;}
  .pct.neg{color:var(--neg);font-family:'JetBrains Mono',monospace;font-weight:600;}
  .amt{font-family:'JetBrains Mono',monospace;color:var(--text-muted);}
  .na{color:var(--text-dim);}
  .spark{vertical-align:middle;}

  .heat-wrap{overflow-x:auto;margin-top:30px;}
  .heat-title{font-size:15px;margin:0 0 4px;}
  .heat-sub{font-size:11px;color:var(--text-dim);margin-bottom:14px;}
  table.heatmap{border-collapse:collapse;font-size:10px;}
  table.heatmap th{color:var(--text-dim);font-weight:500;padding:3px 4px;text-align:center;white-space:nowrap;}
  table.heatmap td{width:26px;height:22px;text-align:center;color:#0B0E14;font-family:'JetBrains Mono',monospace;font-size:9px;}
  table.heatmap td.rowlabel{color:var(--text-muted);text-align:right;padding-right:8px;width:auto;font-size:11px;}

  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border-soft);color:var(--text-dim);font-size:11px;}

  @media (max-width:900px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){
    table:not(.heatmap),thead,tbody,th,td,tr{display:block;}
    thead{display:none;}
    tbody tr{padding:12px 0;}
    tbody td{text-align:left;padding:3px 0;}
    tbody td::before{content:attr(data-label);display:inline-block;width:100px;color:var(--text-dim);font-size:10.5px;}
  }
</style>
</head>

function fmtPct(v){
  if(v==null) return '<span class="na">—</span>';
  const s=(v>=0?"+":"")+v.toFixed(1)+"%";
  return `<span class="pct ${v>=0?"pos":"neg"}">${s}</span>`;
}
function fmtAmt(v){
  if(v==null) return '<span class="na">—</span>';
  return `<span class="amt">${v.toLocaleString(undefined,{maximumFractionDigits:1})}억$</span>`;
}
function signal(recent, cum){
  if(recent==null||cum==null) return {c:"decel",l:"데이터부족"};
  if(recent>=0 && cum>=0) return recent>=cum ? {c:"accel",l:"가속"} : {c:"decel",l:"둔화"};
  if(recent<0 && cum<0) return recent>cum ? {c:"improve",l:"낙폭축소"} : {c:"worsen",l:"악화"};
  if(recent>=0 && cum<0) return {c:"improve",l:"플러스전환"};
  return {c:"worsen",l:"마이너스전환"};
}
function sparkSvg(trend){
  const vals = trend.filter(v=>v!=null);
  if(vals.length<2) return '<span class="na">—</span>';
  const w=70,h=22,pad=2;
  const min=Math.min(...vals), max=Math.max(...vals);
  const range = (max-min)||1;
  const step = (w-pad*2)/(trend.length-1);
  let pts=[]; trend.forEach((v,i)=>{ if(v==null) return; const x=pad+i*step; const y=h-pad-((v-min)/range)*(h-pad*2); pts.push(`${x.toFixed(1)},${y.toFixed(1)}`); });
  const last = vals[vals.length-1];
  const color = last>=0 ? "#34D399" : "#F87171";
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function heatColor(v){
  if(v==null) return "#181E2A";
  const clamp = Math.max(-100, Math.min(100, v));
  if(clamp>=0){
    const t = clamp/100;
    const l = 55 - t*25;
    return `hsl(158, 55%, ${l}%)`;
  } else {
    const t = -clamp/100;
    const l = 60 - t*20;
    return `hsl(0, 65%, ${l}%)`;
  }
}

const kpiDefs = [
  {key:"총계", label:"수출 (구간)", field:"latest_amt", yoyField:"recent_yoy"},
  {key:"총계", label:"수출 · 당월누적", field:"cum_amt", yoyField:"cum_yoy"},
  {key:"반도체", label:"반도체 (구간)", field:"latest_amt", yoyField:"recent_yoy"},
  {key:"총계(반도체 제외)", label:"반도체 제외 (구간)", field:"latest_amt", yoyField:"recent_yoy"},
  {key:"수입", label:"수입 (구간)", field:"latest_amt", yoyField:"recent_yoy"},
  {key:"무역수지", label:"무역수지 (구간)", field:"latest_amt", yoyField:null},
];
document.getElementById("kpis").innerHTML = kpiDefs.map(d=>{
  const it = items[d.key] || {};
  const val = it[d.field];
  const yoyV = d.yoyField ? it[d.yoyField] : null;
  return `<div class="kpi">
    <div class="label">${d.label}</div>
    <div class="value">${val!=null ? val.toLocaleString(undefined,{maximumFractionDigits:1})+"억$" : "—"}</div>
    <div class="yoy ${yoyV==null?'':(yoyV>=0?'pos':'neg')}">${d.yoyField ? (yoyV!=null ? "YoY "+(yoyV>=0?"+":"")+yoyV.toFixed(1)+"%" : "—") : ""}</div>
  </div>`;
}).join("");

document.getElementById("metaline").innerHTML =
  `관세청 10일 단위 잠정치 · 최신구간 <b>${DATA.meta.latest_label}</b> · 생성 ${DATA.meta.generated}`;

// ---- Insights (자동 생성) ----
const order = DATA.order;
function insightRank(field){
  return order
    .filter(name=>items[name] && items[name][field]!=null)
    .map(name=>({name, v:items[name][field]}))
    .sort((a,b)=>b.v-a.v);
}
const byMomentum = insightRank("momentum");
const insights = [];
if(byMomentum.length){
  const top = byMomentum[0], bottom = byMomentum[byMomentum.length-1];
  insights.push({tag:"가속", text:`<b>${top.name}</b>이 가장 강하게 가속 중입니다 (모멘텀 ${top.v>=0?"+":""}${top.v.toFixed(1)}pp).`});
  insights.push({tag:"경계", text:`<b>${bottom.name}</b>은 최근 3구간 대비 직전 3구간에서 가장 둔화됐습니다 (모멘텀 ${bottom.v>=0?"+":""}${bottom.v.toFixed(1)}pp).`});
}
const semi = items["반도체"], exSemi = items["총계(반도체 제외)"];
if(semi && exSemi && semi.recent_yoy!=null && exSemi.recent_yoy!=null){
  insights.push({tag:"쏠림", text:`반도체 최신구간 YoY <b>${semi.recent_yoy>=0?"+":""}${semi.recent_yoy.toFixed(1)}%</b> vs 반도체 제외 <b>${exSemi.recent_yoy>=0?"+":""}${exSemi.recent_yoy.toFixed(1)}%</b> — 격차가 ${Math.abs(semi.recent_yoy-exSemi.recent_yoy)>50?"크게 벌어져 있어 쏠림이 뚜렷합니다.":"크지 않아 반도체 외 품목도 견조합니다."}`});
}
document.getElementById("insights").innerHTML = insights.map(i=>
  `<div class="insight-item"><span class="tag">${i.tag}</span><div>${i.text}</div></div>`
).join("") || '<div class="insight-item">데이터가 더 쌓이면 인사이트가 채워집니다.</div>';

// ---- Signal board ----
document.getElementById("tbl-signal").innerHTML = order.map(name=>{
  const it = items[name] || {};
  const sig = signal(it.recent_yoy, it.cum_yoy);
  return `<tr>
    <td data-label="품목"><span class="item-name">${name}</span></td>
    <td data-label="시그널"><span class="badge ${sig.c}"><span class="d"></span>${sig.l}</span></td>
    <td data-label="최신구간 YoY">${fmtPct(it.recent_yoy)}</td>
    <td data-label="3개월 추세">${sparkSvg(it.trend9||[])}</td>
    <td data-label="모멘텀(pp)">${it.momentum!=null ? (it.momentum>=0?"+":"")+it.momentum.toFixed(1) : '<span class="na">—</span>'}</td>
    <td data-label="당월누적 YoY">${fmtPct(it.cum_yoy)}</td>
    <td data-label="TTM YoY">${fmtPct(it.ttm_yoy)}</td>
    <td data-label="TTM(억$)">${fmtAmt(it.ttm_amt)}</td>
  </tr>`;
}).join("");

// ---- Heatmap ----
const hm = DATA.heatmap;
if(hm && hm.labels && hm.labels.length){
  let thead = "<tr><td></td>" + hm.labels.map(l=>`<th>${l.split(' ')[1]||l}</th>`).join("") + "</tr>";
  let rows = order.map(name=>{
    const vals = hm.matrix[name] || [];
    const cells = vals.map(v=>`<td style="background:${heatColor(v)}" title="${v!=null?v.toFixed(1)+'%':''}">${v!=null?Math.round(v):''}</td>`).join("");
    return `<tr><td class="rowlabel">${name}</td>${cells}</tr>`;
  }).join("");
  document.getElementById("heatmap").innerHTML = thead + rows;
}
</script>
</body>
</html>
